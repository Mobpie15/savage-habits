name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK + SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prebuild native project
        run: npx expo prebuild --platform android
        env:
          CI: 1

      - name: Generate signing key (test)
        run: keytool -genkeypair -v -keystore /tmp/test.keystore -alias testkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=SavageHabits"

      - name: Build release APK (standalone, bundle inside)
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -PMYAPP_UPLOAD_STORE_FILE=/tmp/test.keystore -PMYAPP_UPLOAD_KEY_ALIAS=testkey -PMYAPP_UPLOAD_STORE_PASSWORD=android -PMYAPP_UPLOAD_KEY_PASSWORD=android
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: savage-habits-apk
          path: android/app/build/outputs/apk/release/app-release.apk
